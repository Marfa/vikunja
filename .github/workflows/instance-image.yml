name: Instance image

# Build API image + nginx frontend for todo.themarfa.name.
# Runs on GitHub (not the 1.8 GiB VPS). Deploy job pulls GHCR via tooling/_deploy_from_ghcr.py.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: instance-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: marfa/vikunja
  RELEASE_VERSION: 2.4.0-weekday-repeat

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  frontend:
    name: Frontend dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-frontend

      - name: Build
        working-directory: frontend
        run: |
          echo "{\"VERSION\": \"${RELEASE_VERSION}\"}" > src/version.json
          pnpm run build

      - name: Pack dist
        run: |
          mkdir -p pack
          mv frontend/dist pack/frontend-dist
          tar -C pack -czf frontend-dist.tar.gz frontend-dist

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  image:
    name: API image → GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=weekday-repeat
            type=sha,prefix=sha-,format=short
            type=raw,value=instance-latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Requires repo secrets: INSTANCE_DEPLOY_HOST, INSTANCE_DEPLOY_SSH_KEY
  # Optional: INSTANCE_DEPLOY_USER (default root). Skips when host secret is unset.
  deploy:
    name: Deploy VPS from GHCR
    needs: [frontend, image]
    runs-on: ubuntu-latest
    if: github.repository == 'Marfa/vikunja' && github.ref == 'refs/heads/main'
    steps:
      - name: Require deploy secrets
        id: gate
        env:
          HOST: ${{ secrets.INSTANCE_DEPLOY_HOST }}
          KEY: ${{ secrets.INSTANCE_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "INSTANCE_DEPLOY_HOST / INSTANCE_DEPLOY_SSH_KEY not set — skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          name: frontend-dist
          path: /tmp/vikunja-deploy

      - name: Install SSH key
        if: steps.gate.outputs.skip == 'false'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.INSTANCE_DEPLOY_SSH_KEY }}

      - name: Trust host
        if: steps.gate.outputs.skip == 'false'
        env:
          HOST: ${{ secrets.INSTANCE_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload deploy assets
        if: steps.gate.outputs.skip == 'false'
        env:
          HOST: ${{ secrets.INSTANCE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INSTANCE_DEPLOY_USER }}
        run: |
          USER="${DEPLOY_USER:-root}"
          scp /tmp/vikunja-deploy/frontend-dist.tar.gz \
            tooling/_deploy_from_ghcr.py \
            "${USER}@${HOST}:/tmp/"

      - name: Pull GHCR + restart (no build)
        if: steps.gate.outputs.skip == 'false'
        env:
          HOST: ${{ secrets.INSTANCE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INSTANCE_DEPLOY_USER }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:instance-latest
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          USER="${DEPLOY_USER:-root}"
          ssh "${USER}@${HOST}" \
            "GHCR_TOKEN=$(printf %q "$GHCR_TOKEN") GHCR_USER=$(printf %q "$GHCR_USER") \
             python3 /tmp/_deploy_from_ghcr.py \
              --image $(printf %q "$IMAGE") \
              --frontend-tar /tmp/frontend-dist.tar.gz"
