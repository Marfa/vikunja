name: Instance image

# Build API image + nginx frontend for todo.themarfa.name.
# Runs on GitHub (not the 1.8 GiB VPS). Deploy with tooling/_deploy_from_ghcr.py.

on:
  push:
    branches:
      - feat/instance-weekday-repeat
  workflow_dispatch:

concurrency:
  group: instance-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: marfa/vikunja
  RELEASE_VERSION: 2.4.0-weekday-repeat

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  frontend:
    name: Frontend dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-frontend

      - name: Build
        working-directory: frontend
        run: |
          echo "{\"VERSION\": \"${RELEASE_VERSION}\"}" > src/version.json
          pnpm run build

      - name: Pack dist
        run: |
          mkdir -p pack
          mv frontend/dist pack/frontend-dist
          tar -C pack -czf frontend-dist.tar.gz frontend-dist

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  image:
    name: API image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=weekday-repeat
            type=sha,prefix=sha-,format=short
            type=raw,value=instance-latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
